name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Yoink.slnx

      - name: Build
        run: dotnet build Yoink.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Yoink.slnx --configuration Release --no-build --logger "console;verbosity=normal"
